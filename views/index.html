<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store | Home</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LUXE.</div>
        <ul class="nav-links">
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/products">Products</a></li>
        </ul>
        <div class="nav-icons">
            <span class="icon">🔍</span>
            <span class="icon">🛒</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Elevate Your Style</h1>
            <p>Discover our curated collection of premium essentials designed for the modern lifestyle.</p>
            <a href="/products" class="btn">Shop Now</a>
        </div>
    </header>

    <section class="featured">
        <h2>Featured Collections</h2>
        <div class="grid">
            <div class="card">
                <img src="/assets/classic.png" alt="Classic Elegance" class="card-img">
                <h3>Classic Elegance</h3>
            </div>
            <div class="card">
                <img src="/assets/minimal.png" alt="Modern Minimal" class="card-img">
                <h3>Modern Minimal</h3>
            </div>
        </div>
    </section>

    <script src="/js/main.js"></script>
</body>
</html>
