<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products | Premium Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LUXE.</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/products" class="active">Products</a></li>
        </ul>
    </nav>

    <main class="products-container">
        <header class="page-header">
            <h1>Our Collection</h1>
            <p>Quality materials. Timeless designs.</p>
        </header>

        <div class="products-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="image-wrapper">
                    <img src="/assets/bag.png" alt="Premium Leather Bag" class="card-img">
                </div>
                <div class="info">
                    <h3>Premium Leather Bag</h3>
                    <p class="price">$299.00</p>
                    <a href="/products/1" class="btn-sm">View Details</a>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="product-card">
                <div class="image-wrapper">
                    <img src="/assets/watch.png" alt="Minimalist Watch" class="card-img">
                </div>
                <div class="info">
                    <h3>Minimalist Watch</h3>
                    <p class="price">$150.00</p>
                    <a href="/products/2" class="btn-sm">View Details</a>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="product-card">
                <div class="image-wrapper">
                    <img src="/assets/scarf.png" alt="Silk Scarf" class="card-img">
                </div>
                <div class="info">
                    <h3>Silk Scarf</h3>
                    <p class="price">$85.00</p>
                    <a href="/products/3" class="btn-sm">View Details</a>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
