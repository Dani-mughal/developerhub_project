<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Premium Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LUXE.</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
        </ul>
    </nav>

    <main class="details-container">
        <div class="details-grid">
            <div class="main-image">
                <img src="/assets/classic.png" alt="Premium Essentials" class="card-img large">
            </div>
            <div class="content">
                <span class="category">Accessories</span>
                <h1>Premium Essentials</h1>
                <p class="price">$199.00</p>
                <div class="description">
                    <p>Handcrafted with the finest materials, this piece is designed to last a lifetime. Every detail has been carefully considered to provide both functionality and aesthetic appeal.</p>
                </div>
                <div class="actions">
                    <button class="btn">Add to Cart</button>
                    <button class="btn btn-outline">Wishlist</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
